# Provider definition: models that run on the operator's own Apple silicon machine.
#
# Schema and rationale: docs/models-providers.md. The directory name is the identifier models
# reference with `provider = "local_mps"`.
#
# This provider is not a service anybody operates, so most of what a provider file normally
# transcribes - an endpoint with terms of use, a key issued by a dashboard, a fair-use fraction -
# does not exist here. What replaces them is capacity: one engine process holds one model in
# memory, on memory the rest of the machine is also spending, so the concurrency rules below are
# statements about the hardware rather than about a policy someone published.

schema_version = 3
label = "Local (MPS)"

# The host gate. `metal` is answered by tools/host_caps.py, which reports it only for Darwin on
# arm64 - the one combination where the GPU addresses the same memory the CPU does, which is what
# lets a 17 GB weight set run in a laptop at all. A host without it never sees this provider in
# ./start.sh: providers/local_mps is filtered out of the catalog before the picker runs, and every
# model under it goes with it, which is the same mechanism that already drops a model whose
# provider directory is absent. `local_cuda` will name `cuda` the same way.
requires = ["metal"]

# Local capacity is a launch-time allocation, not a provider fair-use allowance.
# Native windows and explicit slots are independent of physical-memory observations.
rule = []

# Named serving profiles, one per engine. A model selects exactly one with
# `[serving] profile = <id>`; nothing chooses an engine at runtime, and a provider offering more
# than one profile therefore has no default - the choice is always written down.
#
# Both profiles repeat `context_granularity` and `max_sequences` because those are engine
# *capabilities*, not policy: the resolver refuses a native window the serving engine cannot
# express, and one slot count per provider would be a claim about whichever engine happened to
# be described first.
[execution]
kind = "local"

[execution.profiles.llama_cpp_q4]
engine = "llama_cpp"
context_granularity = 256
max_sequences = 256
batch_tokens = 2048
microbatch_tokens = 512
cache_type_k = "f16"
cache_type_v = "f16"
flash_attention = "auto"
load_mode = "auto"
lazy_mode = "auto"
gpu_layers = "all"
kv_unified = false
cache_ram_mib = 0
context_checkpoints = 0

# The MLX serving of the 27B. These numbers are UNQUALIFIED DEFAULTS, not measurements: no native
# qualification has been run on any Apple silicon host, and docs/capacity-compatibility.md says the
# same in its verification section ("Native declarations remain `pending_native_validation`"). They
# are written here as concrete values rather than placeholders because the engine fingerprint hashes
# these bytes, and a profile that changed on first measurement would invalidate every receipt.
#
# `prefill_chunk_tokens` must be one of `prefill_chunk_candidates`. That constrains the shape of a
# future tuning change — it cannot introduce an untested magnitude — but it is not a substitute for
# the benchmark, and nothing here records that one was run. Replace this paragraph with a citation
# to a real qualification record when `tools/local_qualification.py` has produced one, and only mark
# the profile `validated` together with `validation_evidence`, which the schema already requires.
#
# `allocator_cache_bytes = 0` retains no free buffers for the engine's allocator. It is a residency
# knob and not a context knob: it never resizes a window and never gates a launch.
#
# This profile deliberately declares NO cache precision. llama.cpp takes `--cache-type-k/-v` as real
# server flags, so the same keys there are controls; in MLX the attention cache dtype is a property
# of the loaded model and nothing the harness can set. Declaring "f16" here would have the profile
# assert a control it does not hold, and would hash into the engine fingerprint a value that changes
# no behaviour — which is the defect class this whole pass has been removing. If a future mlx-lm
# exposes it, restore the keys together with code that establishes *and attests* them.
#
# `prefix_cache = "none"`: generation owns a per-request cache, so nothing is reused across
# requests at all. "continuation_only" was declared here while no code read it, which read as a
# half-built prefix cache; it is in fact an unimplemented feature. Reaching it needs a conversation
# identity on the wire plus upstream's `can_trim_prompt_cache` gate, and trimming a hybrid
# recurrent+KV state without both is how answers get contaminated rather than cached.
[execution.profiles.mlx_lm]
engine = "mlx_lm"
context_granularity = 256
max_sequences = 1
kv_allocation = "growing"
prefill_chunk_tokens = 2048
prefill_chunk_candidates = [512, 1024, 2048, 4096]
allocator_cache_bytes = 0
prefix_cache = "none"

# How deliberately-wired bytes are chosen. This bounds residency; it is not an admission test and
# it cannot resize a context window or a slot count. `unknown_measurements = "unwired"` means a
# measurement the host will not give turns deliberate residency off rather than inventing a number.
[execution.memory]
strategy = "bounded_wiring"
target = "min_available_and_recommended"
distribution = "verified_weight_bytes"
unknown_measurements = "unwired"

[capacity]
strategy = "native_context"
# Full native windows, with paging and allocation left to the OS and backend.
# This is execution capacity, not a RAM-fit claim or a provider fair-use rule.
sequence_slots = 1
validation_status = "pending_native_validation"

[endpoint]
# The Mac as the Docker Desktop VM sees it. Reaching 127.0.0.1 on the host from a container is not
# possible, which is why the ComfyUI MPS bridge listens on this same gateway address; the engine
# tools/local_llm.py starts binds the interface for the same reason. No /v1 suffix - the proxy
# appends its own route per request.
base_url = "http://host.docker.internal:8181"
base_url_env = "LOCAL_MPS_BASE_URL"

# llama-server, and every other engine worth supporting here, answers the OpenAI chat-completions
# shape - so the proxy that already fronts NRP needs no new code path, only a new origin per lane.
protocol = "openai"

# The private cache salt exists so a shared gateway cannot key its prompt cache on one operator's
# content. There is no shared cache to protect here, and an engine is under no obligation to
# ignore a request field it does not model.
sends_cache_salt = false

# No issuer, no dashboard, no key to paste. The launcher generates this token per session, writes
# it to the same mode-0600 credentials directory the proxy already mounts, and hands the same
# value to the engine it starts - which is what lets a listener that has to be reachable from the
# VM refuse strangers without the operator configuring anything.
#
# `env` is the override: pin a value in .env and this session uses it instead of a fresh one.
[[credential]]
id = "default"
label = "Local engine token"
prompt = "Local engine token (leave blank to generate one for this session)"
env = "LOCAL_MPS_API_KEY"
generate = true
