services:
  searxng-init:
    image: docker.io/searxng/searxng:2026.9.10-931fd9787@sha256:2fb0fa85096fe6df5c3ab98ecb4d6e0ee2ef66b8fb96ce6fce0f75b51c4bd90a
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /var/cache/searxng && chown 977:977 /var/cache/searxng && chmod 700 /var/cache/searxng"]
    volumes:
      - type: volume
        source: searxng-cache
        target: /var/cache/searxng
        volume:
          nocopy: true
    read_only: true
    cap_drop: [ALL]
    # chmod needs FOWNER after chown, including on repeat starts.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    pids_limit: 64

  searxng:
    image: docker.io/searxng/searxng:2026.9.10-931fd9787@sha256:2fb0fa85096fe6df5c3ab98ecb4d6e0ee2ef66b8fb96ce6fce0f75b51c4bd90a
    environment:
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}"
      FORCE_OWNERSHIP: "false"
    depends_on:
      searxng-init:
        condition: service_completed_successfully
    user: "977:977"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - type: volume
        source: searxng-cache
        target: /var/cache/searxng
        volume:
          nocopy: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "3"}
    networks:
      search-backend: {}
      search-egress: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12

  search-adapter:
    image: "adrc-search-adapter:${HARNESS_IMAGE_SUFFIX:?Generated by start.sh}"
    build:
      context: ./search-adapter
    depends_on:
      searxng:
        condition: service_healthy
    environment:
      SEARXNG_URL: "http://searxng:8080"
      SEARCH_ADAPTER_TOKEN: "${SEARCH_ADAPTER_TOKEN:?Generated by start.sh}"
      SEARCH_MAX_RESPONSE_BYTES: "${SEARCH_MAX_RESPONSE_BYTES:-4194304}"
      SEARCH_MAX_RESULTS: "${SEARCH_MAX_RESULTS:-20}"
      SEARCH_MAX_REQUEST_BYTES: "${SEARCH_MAX_REQUEST_BYTES:-65536}"
      SEARCH_MAX_FIELD_CHARS: "${SEARCH_MAX_FIELD_CHARS:-16384}"
      SEARCH_MAX_OUTPUT_BYTES: "${SEARCH_MAX_OUTPUT_BYTES:-1048576}"
      SEARCH_CONNECT_TIMEOUT: "${SEARCH_CONNECT_TIMEOUT:-10}"
      SEARCH_READ_TIMEOUT: "${SEARCH_READ_TIMEOUT:-20}"
    networks:
      agent-search: {}
      search-backend: {}
    read_only: true
    # Bounded and non-executable: the adapter is pure Python that pre-installs its
    # dependencies at build time and never writes a temporary file.
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "3"}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6

  kimi-agent:
    depends_on:
      search-adapter:
        condition: service_healthy
    environment:
      KIMI_WEB_SEARCH_BASE_URL: "http://search-adapter:8080/search"
      KIMI_WEB_SEARCH_API_KEY: "${SEARCH_ADAPTER_TOKEN:?Generated by start.sh}"
    networks:
      agent-search: {}

volumes:
  searxng-cache:

networks:
  agent-search:
    internal: true
  search-backend:
    internal: true
  search-egress: {}
