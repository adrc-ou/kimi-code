# Model definition: immutable facts about one model the harness can serve.
#
# Schema and rationale: docs/models-providers.md. This file describes the model only.
# Provider policy (concurrency, context fractions, token rates) belongs to the provider
# named below, never here, and neither belongs in .env.
#
# The directory name is the stable identifier; `label` is the user-facing name shown by
# ./start.sh. Copy this directory to add a model, delete it to remove one.

schema_version = 1

label = "Qwen3.8-Flash-Next"
provider = "nrp"

# Identifier sent upstream. Kimi's own alias is derived from `slug` below.
model = "Qwen3.8 Flash Next"

# Short stable stem for Kimi model aliases: qwen3-primary, qwen3-long, qwen3-subagent.
slug = "qwen3"

# Required: the provider-scoped credential this model falls back to when its own key_env
# is unset. Models that share a credential id share that one provider key.
credential = "default"

# Optional: the .env variable holding a key for this model alone. Set, and this model
# authenticates with that key instead of the provider-scoped one named above; blank or
# absent, it falls back to that key. Either name may be persisted in .env, and ./start.sh
# asks for this model's key by name when neither is set.
key_env = "QWEN3_API_KEY"

# Metadata copied into every generated Kimi model table, unless a lane overrides the effort.
# Capabilities describe the model, not the slice of it a lane uses, so they are not per lane.
capabilities = ["thinking", "image_in", "video_in", "tool_use"]
support_efforts = ["low", "medium", "xhigh"]
default_effort = "xhigh"

# What the provider advertises as this model's context length. Fraction-based provider
# rules are measured against this number, not against any single lane's window.
# Defaults to the largest declared lane window when omitted.
[context]
advertised_tokens = 1000000

# Native window is 262,144 tokens, offered as the Medium (concurrent) peer: its smaller
# reservation is what leaves the provider's in-flight pool room to overlap requests.
[lane.primary]
context_tokens = 262144
input_tokens = 196608
output_clamp_tokens = 65536

# Optional lane. Declaring it creates the /long route and the qwen3-long alias, offered as
# the Long (queued) peer and launched by default: the wider window is worth more than the
# overlap it spends. A request there runs alone only when priced at or above the provider's
# exclusive threshold; a short one still overlaps. Omitting the lane removes both.
[lane.long]
context_tokens = 1000000
input_tokens = 900000
output_clamp_tokens = 65536

# Subagent lane. Five concurrent children at this size is what the provider's aggregate
# context rule permits, and ./start.sh derives Kimi's swarm concurrency from it.
#
# reservation = input_tokens + output_clamp_tokens. context_tokens is NOT a term in it; the
# window only has to be >= that sum, and tools/policy.py silently shrinks input to
# (context - clamp) if it is not. So widening the window is free, and the real ceiling is the
# fan-out rule: 332,500 // 66,500 == 5 but // 66,501 == 4, which makes 66,500 the largest
# reservation this lane can hold at five-wide. Keeping input at 55,808 leaves 10,692 for the
# clamp -- the most answer budget available without either costing a child its concurrency or
# costing it compaction headroom.
#
# Why the clamp matters more than it looks. Kimi requests max_tokens = the whole lane window on
# every call (measured: 64,000 on all 12,299 subagent requests, 262,144 on primary, 1,000,000 on
# long), and the proxy answers with min(asked, output_clamp_tokens). This lane is therefore the
# tightest clamp of the three in both ratio and effect, and it fails children two ways:
#   - a step truncated at the clamp: 9 of 231 children (3.9%) ended their FINAL report truncated;
#   - a compaction summary truncated: 11 (4.8%) hit CompactionTruncatedError, because Kimi asks
#     min(window, 131072) completion tokens for a summary and used to be answered 8,192.
# These are disjoint; together 20 children (8.7%) died of output length. Every one surfaced to
# its parent as an explicit failure, never as silent corruption -- but the parent then re-derived
# the work by hand or respawned children with hand-tuned "under 500 words" prompts.
#
# Raising the clamp costs the in-flight permit price (priced from the clamp too) and the
# per-minute output booking, but NOT context: compaction fires at min(0.85 x input, input -
# reserved_context_size), and input is unchanged at 55,808, so the trigger stays 47,436.
# Do not trade input for clamp to get more answer room -- that moves the trigger to 39,424,
# 16.9% sooner, and adds ~1,900 compaction events across this corpus.
#
# The next rung up is a real decision, not an oversight: fan-out 4 allows a reservation of
# 83,125, i.e. a clamp of 27,317 with input still 55,808, which covers the largest answer any
# lane has ever produced (26,222). That would essentially eliminate both truncation channels at
# the cost of one fifth of swarm width.
[lane.subagent]
context_tokens = 66500
input_tokens = 55808
output_clamp_tokens = 10692
