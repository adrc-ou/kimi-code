# Model definition: Qwen3.8-27B, served from this machine by an engine the harness starts.
#
# Schema and rationale: docs/models-providers.md. This is a sibling of the same model name under
# another provider directory, and that is the point: models/ is filed by (provider, model) because
# a remote gateway and a laptop do not serve the same thing even when they serve the same weights.
# Nothing here is shared with models/nrp/ - the windows differ, the credentials differ, the host
# floors exist only for this one.
#
# Copy the directory to add another local model; delete it (weights/ and all) to remove one.

schema_version = 2

label = "Qwen3.8-27B"
provider = "local_mps"

# The identifier sent upstream. llama-server answers `/v1/models` with its own model name, and
# `--alias` is what makes it answer with this one, so the wire name is a fact about this serving
# rather than about the checkpoint.
model = "Qwen3.8-27B"

# Kimi aliases: qwen27m-primary, qwen27m-subagent. Distinct from the `qwen3` stem the NRP
# definitions use, because aliases are the one place a model's two servings stay addressable.
slug = "qwen27m"

credential = "default"

# What this model can do *through this engine*. Both are facts about the serving as much as the
# weights: 27B is a vision model, but a multimodal projection file is a second download and
# llama.cpp needs it loaded explicitly (`--mmproj`), so the harness that has not fetched one
# declares no image_in rather than letting Kimi send pixels an adapter is not there to read.
# Video likewise. Adding the projection file to weights.lock.json is what re-opens both.
capabilities = ["thinking", "tool_use"]
support_efforts = ["low", "medium", "xhigh"]
default_effort = "xhigh"

# The window the checkpoint was trained for (262,144; extendable to 1M with YaRN). No fraction
# rule measures against it - the local provider publishes none - so this is documentation with a
# job: it must not be smaller than any lane below.
[context]
native_tokens = 262144

# ------------------------------------------------------------
# Static host eligibility for the pinned quant, independent of current free RAM.
# Passing this floor does not shrink native context or promise resident execution.
[requires]
memory_gib = 32
disk_gib = 24

# ------------------------------------------------------------
# Both roles use the full declared native window. The provider declares slots;
# no memory-fit policy shrinks the window or adds concurrency.
# Output is bounded by actual remaining context rather than a fixed partition.
[lane.primary]
allocation = "engine"
output_mode = "remaining_context"

[lane.subagent]
allocation = "engine"
output_mode = "remaining_context"
default_effort = "low"

[install]
variant = "UD-Q4_K_XL"
lock = "weights.lock.json"
port = 8181

[install.sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
