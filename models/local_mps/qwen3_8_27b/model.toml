# Model definition: Qwen3.8-27B, served from this machine by an engine the harness starts.
#
# Schema and rationale: docs/models-providers.md. This is a sibling of the same model name under
# another provider directory, and that is the point: models/ is filed by (provider, model) because
# a remote gateway and a laptop do not serve the same thing even when they serve the same weights.
# Nothing here is shared with models/nrp/ - the windows differ, the credentials differ, the host
# floors exist only for this one.
#
# Copy the directory to add another local model; delete it (weights/ and all) to remove one.

schema_version = 1

label = "Qwen3.8-27B"
provider = "local_mps"

# The identifier sent upstream. llama-server answers `/v1/models` with its own model name, and
# `--alias` is what makes it answer with this one, so the wire name is a fact about this serving
# rather than about the checkpoint.
model = "Qwen3.8-27B"

# Kimi aliases: qwen27m-primary, qwen27m-subagent. Distinct from the `qwen3` stem the NRP
# definitions use, because aliases are the one place a model's two servings stay addressable.
slug = "qwen27m"

credential = "default"

# What this model can do *through this engine*. Both are facts about the serving as much as the
# weights: 27B is a vision model, but a multimodal projection file is a second download and
# llama.cpp needs it loaded explicitly (`--mmproj`), so the harness that has not fetched one
# declares no image_in rather than letting Kimi send pixels an adapter is not there to read.
# Video likewise. Adding the projection file to weights.lock.json is what re-opens both.
capabilities = ["thinking", "tool_use"]
support_efforts = ["low", "medium", "xhigh"]
default_effort = "xhigh"

# The window the checkpoint was trained for (262,144; extendable to 1M with YaRN). No fraction
# rule measures against it - the local provider publishes none - so this is documentation with a
# job: it must not be smaller than any lane below.
[context]
advertised_tokens = 262144

# ------------------------------------------------------------
# What this machine has to be
#
# The quantised build below is 17,559,178,144 bytes = 16.4 GiB. Unsloth's own floor for a 4-bit
# build of this model is "a Mac with 24 GB RAM", and 24 GiB is where that gets tight on this
# harness specifically: the engine runs on the host, outside every container limit, and the
# Docker Desktop VM that runs the agent takes its memory out of the same unified pool the weights
# need (plus the macOS wired-buffer ceiling, roughly three quarters of RAM). So the floor here is
# 32 GiB - one notch above the vendor's, raised for the co-resident VM rather than lowered to fit
# a machine. A 24 GiB Mac is refused by this definition even though the model would run on it.
#
# Disk is the download plus the KV cache file the engine may memory-map, measured in GiB against
# the filesystem the harness checkout lives on.
[requires]
memory_gib = 32
disk_gib = 24

# ------------------------------------------------------------
# Lanes, sized for the smallest host this model is offered on.
#
# Every lane must satisfy input_tokens + reserved_context_size (8,192 today, from
# runtime/config.toml) <= context_tokens, and the context the engine is started with has to cover
# the widest lane sum, because KV cache is the binding constraint on 16 GiB of weights in a
# 32 GiB machine. That is why these windows are a fraction of the native 262K: this is a working
# agent's budget, not the model's ceiling.
#
# No `long` lane at all. On this host the wide window is not a thing to trade queueing against -
# there is no second pool of capacity behind it - and a lane that could not be admitted would be
# a lane the operator could select and never use.
[lane.primary]
context_tokens = 32768
input_tokens = 20480
output_clamp_tokens = 8192

# Subagent lane. The provider's model-scoped rule allows two concurrent requests, so the fan-out
# the launcher publishes for a local subagent lane is 2, not the 5 a cloud pool supports. Children
# run narrower and slower here by design; a 27B model answering five children at once on one GPU
# answers none of them.
[lane.subagent]
context_tokens = 16384
input_tokens = 8192
output_clamp_tokens = 4096
default_effort = "low"

# ------------------------------------------------------------
# Installing and serving this model on the host.
#
# `variant` names which build of the quantised repository is fetched - see weights.lock.json
# beside this file for the commit and the SHA-256 of every byte. `port` is where the engine
# listens: two local models need two processes, and the provider's origin keeps the host so
# LOCAL_MPS_BASE_URL can still move it.
#
# The sampling defaults are the vendor's published thinking-mode numbers. They go to the engine,
# not to Kimi: a per-request sampler would be Kimi's choice to make, and it does not make one.
[install]
variant = "UD-Q4_K_XL"
lock = "weights.lock.json"
port = 8181

[install.sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
