# Model definition: Qwen3.8-Flash-Next, served from this machine.
#
# The same model name as models/nrp/qwen3_8_flash_next, and a different definition, because the
# two are not the same offer: the gateway meters its advertised window against published
# fair-use terms, and this one serves its native window with OS-managed memory.
# Both facts are about the serving, so both live here rather than in one
# file with a provider-switching flag.

schema_version = 3

label = "Qwen3.8-Flash-Next"
provider = "local_mps"
model = "Qwen3.8-Flash-Next"

# Kimi aliases: qwen3m-primary, qwen3m-subagent. Distinct from the NRP definition's `qwen3` stem -
# aliases are the one place two servings of one model have to stay addressable.
slug = "qwen3m"

credential = "default"

# See the note on the 27B definition: the checkpoint is multimodal, the projection file is not
# fetched, so image_in is not claimed. Thinking is the model's own default mode and `xhigh` is
# what the harness asks for on the agent lanes.
capabilities = ["thinking", "tool_use"]
support_efforts = ["low", "medium", "xhigh"]
default_effort = "xhigh"

[context]
native_tokens = 262144

# ------------------------------------------------------------
# Static host eligibility for the pinned quant, independent of current free RAM.
# Passing this floor does not shrink native context or promise resident execution.
[requires]
memory_gib = 160
disk_gib = 130

# ------------------------------------------------------------
# Both roles use the full declared native window. The provider declares slots;
# no memory-fit policy shrinks the window or adds concurrency.
# Output is bounded by actual remaining context rather than a fixed partition.
[lane.primary]
allocation = "engine"
output_mode = "remaining_context"

[lane.subagent]
allocation = "engine"
output_mode = "remaining_context"
default_effort = "low"

[install]
variant = "UD-Q4_K_XL"
lock = "weights.lock.json"
# The second local engine on the same host. One process per model, so one port each; the host
# part of the URL still comes from providers/local_mps and LOCAL_MPS_BASE_URL.
port = 8182

[install.sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0

# ------------------------------------------------------------
# Served by the retained llama.cpp profile. Its lookup tables, sparse attention and cache state
# are not qualified under any other engine, so this line is a decision and not a default.
[serving]
profile = "llama_cpp_q4"
