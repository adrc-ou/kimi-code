# The harness has no Tor proxy. These onion engines cannot initialize without one.
use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

general:
  instance_name: "Kimi local search"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - json

server:
  limiter: false
  public_instance: false
  image_proxy: false
