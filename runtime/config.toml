# Kimi Code baseline for this harness.
#
# This file describes how Kimi behaves. It deliberately contains no model facts and no
# provider policy: the model tables, provider tables, default model and subagent binding are
# generated at launch from ./models and ./providers (see docs/models-providers.md) and
# substituted into the placeholder at the foot of this file. A number that appears here would
# be a second copy of a truth that already has one.
#
# Keys that are not listed as user-owned in runtime/config-policy.json are re-pinned on every
# launch, so an in-session change to harness policy does not survive a restart.

# Replaced with the alias of the model selected for the primary agent by ./start.sh.
default_model = "__KIMI_PRIMARY_ALIAS__"

default_permission_mode = "manual"
default_plan_mode = false

merge_all_available_skills = true
extra_skill_dirs = ["/opt/kimi-runtime/skills"]
extra_agent_dirs = ["/opt/kimi-runtime/agents"]

# Keep built-ins while initially configuring the installation.
# Once everything is stable, I would consider false to reduce prompt/tool noise.
builtin_product_skills = true

telemetry = false

# The proxy token is the launcher's internal bearer, substituted per instance. Provider API
# keys never appear here: they are mounted into the proxy container, not the agent's.

[thinking]
enabled = true
effort = "xhigh"


[loop_control]
# Unlimited agentic steps. Context/permissions remain the real boundaries.
max_steps_per_turn = 0

# Current default is 10; make it explicit.
max_attempts_per_step = 10

# Output Kimi leaves unclaimed before it compacts. Every generated lane must fit
# input_tokens + this value inside its window, so it is a harness knob, not a model fact,
# and it has to be small enough to work inside the smallest selected lane.
reserved_context_size = 8192


[token_counting]
strategy = "measured+estimated"


[background]
# Shared across background Agents and background Bash tasks, so this sits above the
# derived subagent permit count: extra slots queue at the proxy instead of stealing a
# lane from a subagent. Fair use is bounded by the proxy, not by this number.
max_running_tasks = 8

# Don't leave orphan processes after the session exits.
keep_alive_on_exit = false

# Long-running commands move to background rather than getting killed.
bash_auto_background_on_timeout = true

# Background Bash tasks get no wall-clock cap; the 0 here is what the compose
# environment also forces, since the UI-owned [background] table can drift.
bash_task_timeout_s = 0


# ============================================================
# Subagent wall-clock limits
#
# 0 means unlimited. These keys are NOT user-owned, so the launcher re-pins them
# every start. Do not try to express "unlimited" through
# KIMI_SUBAGENT_TIMEOUT_MS / KIMI_CODE_SWARM_TIMEOUT_MS: those variables take
# higher priority than this file and accept only a positive integer, so 0 there
# is an invalid value rather than a disabled cap.
# ============================================================

[subagent]
timeout_ms = 0


[swarm]
timeout_ms = 0


# ============================================================
# Generated model and provider configuration
#
# tools/render_runtime.py replaces the marker line below with the [providers.*], [models.*]
# and [secondary_model] tables for the models chosen at launch, plus the hard subagent
# binding. The marker is a comment so this file stays parseable TOML on its own.
# ============================================================
#__KIMI_MODEL_CONFIG__
