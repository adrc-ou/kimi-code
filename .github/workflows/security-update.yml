name: Dependency review

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: python scripts/check_locks.py
      - run: npm audit --audit-level=high --prefix container
      - run: echo "Review base-image digests, source commits, Python locks, compatibility evidence, and expiring vulnerability exceptions."
