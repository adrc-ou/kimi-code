name: Dependency review

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/check_locks.py
      - run: npm audit --audit-level=high --prefix container
      - run: echo "Review base-image digests, source commits, Python locks, compatibility evidence, and expiring vulnerability exceptions."
