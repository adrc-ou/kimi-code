name: Dependency review

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: python scripts/check_locks.py
      # Informational, and it exits 0 either way: the point is to see a base pin falling behind its
      # tag in this weekly report rather than meeting it as a failed security job. The 3.14-alpine
      # pin sat two CPython releases behind that way, carrying a Critical nobody was looking for.
      - name: Report base-image digest drift
        run: python3 scripts/check_vulnerabilities.py --drift-only
      - run: npm audit --audit-level=high --prefix container
      - run: echo "Review base-image digests, source commits, Python locks, compatibility evidence, and expiring vulnerability exceptions."
