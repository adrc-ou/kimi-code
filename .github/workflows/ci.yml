name: CI

on:
  pull_request:
  push:
    branches: [main, restructure/current-kimi-code, restructure/modularity]
  workflow_dispatch:

permissions:
  contents: read

# Every job names its runner image explicitly rather than taking `ubuntu-latest`, because the
# floating label is a scheduled change to this workflow's behaviour: it moves to Ubuntu 26 on a
# date GitHub chose, and a base-image move can change the shell, the linters, the Docker daemon and
# the file-ownership semantics that the compose checks assert. A green run should mean the pinned
# image passed, so the image is pinned here and raised deliberately, in a change that says so.

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      # aiohttp comes from the proxy's own pin rather than a second copy of the version, so
      # CI cannot drift onto a version the shipped image never had. PyYAML is what
      # tests/test_ci_workflow.py reads the workflow with: a test whose import is missing fails as
      # an import error, which takes the whole discover step down, so the pin belongs here where
      # the suite's other non-stdlib import is already named.
      - run: pip install -r proxy/requirements.in PyYAML==6.0.3 ruff==0.13.2
      - run: |
          python -m unittest discover -s tests -v
          for suite in modules/*/tests; do
            [ ! -d "$suite" ] || python -m unittest discover -s "$suite" -v
          done
      # 19 of the launcher tests skip whenever TMPDIR is on a noexec filesystem, and a skipped test
      # that would have caught a P1 is the most expensive kind of green: that is exactly how a
      # launcher fixture missing a shared module stayed invisible on Linux while it failed on
      # macOS. Run them from an explicitly executable directory and require the full count.
      - name: Run launcher tests with no filesystem skips
        env:
          TMPDIR: ${{ runner.temp }}/exec-tmp
        run: |
          mkdir -p "$TMPDIR"
          out="$(python -m unittest tests.test_launchers -v 2>&1)" || {
            printf '%s\n' "$out"
            exit 1
          }
          printf '%s\n' "$out" | tail -n 3
          if printf '%s\n' "$out" | grep -q 'skipped'; then
            echo '::error::launcher tests skipped rather than executing; they must run in CI'
            exit 1
          fi
      - run: python -m compileall -q proxy scripts search-adapter tests tools modules container
      - run: ruff check .
      - run: python scripts/check_locks.py
      - run: python scripts/check_mcp_contracts.py
      # The local-engine work must not move a byte of an NRP-only plan or its generated guidance.
      # Checked as complete captured documents rather than as field assertions, so a plan cannot
      # keep every named field while gaining a counter or losing a route. Regenerating a reference
      # is a deliberate act with a reviewable diff; CI only reports the drift.
      - name: Verify NRP plan and guidance references are unchanged
        run: python tools/capture_local_inference_references.py --check
      # apt's shellcheck on the runner image is two major releases behind, and the linters differ
      # between them, so this gate would report a different set of defects depending on which image
      # the job landed on -- and change again when ubuntu-latest moves. Pin the published release
      # and verify its digest rather than depending on whichever version the image carries.
      - name: Install pinned shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          case "$(uname -m)" in
            x86_64)
              asset="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
              digest=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
              ;;
            aarch64)
              asset="shellcheck-${SHELLCHECK_VERSION}.linux.aarch64.tar.gz"
              digest=68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${asset}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${asset}"
          printf '%s  %s\n' "${digest}" "${RUNNER_TEMP}/${asset}" | sha256sum --check --quiet
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}"
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 \
            "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "${RUNNER_TEMP}/bin/shellcheck"
          # `$GITHUB_PATH` only reaches the steps that follow, so prepend it here too and let the
          # guard below resolve `shellcheck` through PATH rather than by absolute path: that is the
          # same lookup the lint step performs, and it outranks anything the runner image carries.
          export PATH="${RUNNER_TEMP}/bin:${PATH}"
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"
          shellcheck --version
          if [ "$(shellcheck --version | sed -n 's/^version: //p')" != "${SHELLCHECK_VERSION#v}" ]; then
            echo "shellcheck still resolves a version other than ${SHELLCHECK_VERSION}." >&2
            exit 1
          fi
      - run: git ls-files '*.sh' -z | xargs -0 -n1 bash -n
      - run: git ls-files '*.sh' -z | xargs -0 shellcheck
      - run: npm ci --ignore-scripts --prefix container

  compose:
    runs-on: ubuntu-24.04
    env:
      # The floor tools/runtime.sh declares, and the release this repository is tested against.
      COMPOSE_VERSION: v5.5.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The runner image ships a Compose older than that floor. Below v5.0.2, `config --format
      # json` drops an explicit `create_host_path: false`, so the confinement gate cannot read the
      # option it enforces and would refuse a sound launch. Pin the published binary and verify
      # its digest rather than depending on whichever version the runner image happens to carry.
      - name: Install pinned Docker Compose
        run: |
          case "$(uname -m)" in
            x86_64)
              asset=docker-compose-linux-x86_64
              digest=db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576
              ;;
            aarch64)
              asset=docker-compose-linux-aarch64
              digest=732e3a84c1a0f67256ce80bc2598a24546b10ca05f9faa97efceb1171ece2ef7
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/docker-compose" \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/${asset}"
          printf '%s  %s\n' "${digest}" "${RUNNER_TEMP}/docker-compose" | sha256sum --check --quiet
          # A user plugin directory outranks the copy the runner image installed system-wide.
          mkdir -p "${HOME}/.docker/cli-plugins"
          install -m 0755 "${RUNNER_TEMP}/docker-compose" "${HOME}/.docker/cli-plugins/docker-compose"
          docker compose version
          if [ "$(docker compose version --short)" != "${COMPOSE_VERSION#v}" ]; then
            echo "docker still resolves a Compose other than ${COMPOSE_VERSION}." >&2
            exit 1
          fi
      - run: tests/compose-config.sh --runtime

  build-services:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - run: docker buildx build --load --platform '${{ matrix.platform }}' -t adrc-model-proxy:ci proxy
      - run: docker buildx build --load --platform '${{ matrix.platform }}' -t adrc-search-adapter:ci search-adapter
      - name: Verify service images match the requested CPU and start Python
        env:
          EXPECTED_PLATFORM: '${{ matrix.platform }}'
        run: |
          for image in adrc-model-proxy:ci adrc-search-adapter:ci; do
            actual=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${image}")
            if [ "${actual}" != "${EXPECTED_PLATFORM}" ]; then
              echo "${image}: expected ${EXPECTED_PLATFORM}, got ${actual}" >&2
              exit 1
            fi
            docker run --rm --platform "${EXPECTED_PLATFORM}" --network none --read-only \
              --entrypoint python "${image}" -c 'import platform, ssl, urllib.request; print(platform.machine())'
          done
          docker run --rm --platform "${EXPECTED_PLATFORM}" --network none --read-only \
            --entrypoint python adrc-model-proxy:ci -c 'import aiohttp'

  build-agent:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            asset: kimi-code-linux-x64.tar.gz
          - platform: linux/arm64
            asset: kimi-code-linux-arm64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - id: kimi
        env:
          KIMI_ASSET: '${{ matrix.asset }}'
          # api.github.com answers an unauthenticated caller at 60 requests/hour per IP, and every
          # hosted runner shares one, so a resolution that succeeded in an earlier run can fail in
          # this one with nothing changed in this repository - which is exactly what took this step
          # down. scripts/select_versions.py already reads this name, sends it only to the
          # api.github.com host it builds itself, and reads nothing the public release listing does
          # not already show; the per-job token only raises the ceiling to that job's own budget.
          GITHUB_RELEASES_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          # This step's stdout becomes its outputs, and the selector prints `version=` and `url=`
          # before it fetches the checksum, so the result is staged and committed only on success -
          # otherwise a failure leaves half a set of keys on the step. stderr is kept because an
          # annotation is the part of this message that reaches anyone outside the repository log.
          status=0
          resolved="$(mktemp)"
          reason="$(mktemp)"
          PYTHONPATH=scripts python - >"${resolved}" 2>"${reason}" <<'PY' || status=$?
          import os
          from select_versions import fetch_asset_checksum, kimi_catalog
          catalog, latest = kimi_catalog(os.environ["KIMI_ASSET"])
          selected = next(item for item in catalog if item["version"] == latest)
          print(f"version={selected['version']}")
          print(f"url={selected['url']}")
          print(f"sha256={fetch_asset_checksum(selected)}")
          PY
          if [ "${status}" -ne 0 ]; then
            printf '::error::Kimi release metadata for %s could not be resolved (exit %s): %s\n' \
              "${KIMI_ASSET}" "${status}" "$(tr '\n' ' ' <"${reason}" | tail -c 700)"
            cat "${reason}" >&2
            exit "${status}"
          fi
          cat "${resolved}" >>"${GITHUB_OUTPUT}"
      - name: Build the agent image
        run: |
          # Only the runner's own architecture is loaded into Docker. A foreign-platform image
          # cannot be executed here, and the one step that would run it is gated to amd64 below.
          load=""
          if [ '${{ matrix.platform }}' = 'linux/amd64' ]; then load="--load"; fi
          docker buildx build ${load} --platform '${{ matrix.platform }}' \
            -t adrc-kimi-agent:ci -f container/Dockerfile \
            --build-arg KIMI_CODE_VERSION='${{ steps.kimi.outputs.version }}' \
            --build-arg KIMI_CODE_ASSET_URL='${{ steps.kimi.outputs.url }}' \
            --build-arg KIMI_CODE_ASSET_SHA256='${{ steps.kimi.outputs.sha256 }}' .
      # ``RealBundleTests`` skips unless ``/usr/local/bin/kimi`` is a file, so on ``static`` - the
      # only job that runs the suite - the class that proves the anchor patterns still point at
      # literals in the shipped build has never once run in CI. Its own docstring records that
      # those offsets have already moved once. This image is the only place in the repository
      # holding the bundle a session actually loads, so the class runs inside it.
      - name: Check the prompt anchors against the shipped bundle
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run --rm \
            --entrypoint python3 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            -w /src \
            adrc-kimi-agent:ci -m unittest -v tests.test_kimi_prompts

      - name: Check MCP compatibility with the shipped SDK and local fixture servers
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --entrypoint /opt/serena/bin/python \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            -w /src \
            adrc-kimi-agent:ci -m unittest -v tests.test_mcp_probe

      - name: Check interrupted streaming tool calls against unmodified Kimi
        if: matrix.platform == 'linux/amd64'
        run: |
          window=$(python3 -c 'from tests.helpers import shipped_plan; print(max(lane["context_tokens"] for lane in shipped_plan()["lanes"].values()))')
          docker run --rm -i --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --tmpfs /home/agent/.kimi-code:rw,nosuid,nodev,mode=1777,size=256m \
            --entrypoint python3 adrc-kimi-agent:ci - "${window}" \
            < tests/fixtures/native_stream_recovery.py

  build-modules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - run: |
          for build in modules/*/tests/build.sh; do
            [ ! -f "$build" ] || bash "$build"
          done

  # A separate job, because nothing here can run on ubuntu-latest: the MLX wheels are macOS/arm64
  # only and Metal is absent from every hosted Linux runner. The job asserts the *absence* of a
  # host dependency (the Linux suite must import the launcher and proxy without MLX installed) and
  # gates the native probe and qualification behind an explicit operator dispatch, so a green
  # ubuntu run can never be read as native evidence.
  local-mac:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      # The same suite and the same two non-stdlib imports as the static job; see the pin there.
      - run: pip install -r proxy/requirements.in PyYAML==6.0.3 ruff==0.13.2
      - run: python -m unittest discover -s tests
      # The host floor the MLX wheels impose. Every published mlx wheel is tagged macosx_14_0 or
      # newer, so this is a property of the dependency set and not a preference; a runner below it
      # would fail to resolve rather than silently install something else.
      - name: Report the host and the macOS deployment floor
        run: |
          sw_vers
          python3 -c "import platform; print(platform.machine(), platform.mac_ver())"
      # Hardware-qualified steps. A GitHub-hosted Mac has Metal but not the operator's chip, RAM,
      # or model artifact, so this run produces no promotion evidence by design.
      - name: Native feasibility probe
        continue-on-error: true
        run: python tools/local_native_probe.py --output /tmp/probe.json
      - name: Report what the probe concluded
        if: always()
        run: |
          if [ -f /tmp/probe.json ]; then
            python -c "import json;d=json.load(open('/tmp/probe.json'));print(json.dumps(d,indent=2))"
          else
            echo "no probe result written; native feasibility is UNVERIFIED"
          fi

  security:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0 is what gitleaks-action's own README requires, and its absence is why this
      # job kept failing after its ignore file was fixed. The default depth of 1 leaves the tip as
      # a parentless commit, so gitleaks diffs the entire tree against nothing, reports every
      # pre-existing finding again, and attributes it to the tip - whose SHA changes on every push,
      # which no `.gitleaksignore` fingerprint can name in advance. With full history the pushed
      # range is real, findings stay attributed to the commit that introduced them, and the
      # fingerprints in that file are the ones gitleaks recomputes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          # Pinned rather than left to the action's default or to `latest`, because the scanner's
          # version decides both what counts as a leak and the `commit:file:rule:line` shape of a
          # fingerprint - and `.gitleaksignore` holds fingerprints this job depends on. 8.30.1 is
          # the binary those entries were generated and verified against. Raise it deliberately,
          # the way this repository raises every other pin that gates a verdict, and re-check the
          # ignore file in the same change.
          GITLEAKS_VERSION: '8.30.1'
      - run: python scripts/check_locks.py
      - run: docker build -t adrc-model-proxy:ci proxy
      - run: docker build -t adrc-search-adapter:ci search-adapter
      - run: scripts/generate_sbom.sh .artifacts/sbom adrc-model-proxy:ci adrc-search-adapter:ci
