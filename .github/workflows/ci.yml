name: CI

on:
  pull_request:
  push:
    branches: [main, restructure/current-kimi-code, restructure/modularity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      # aiohttp comes from the proxy's own pin rather than a second copy of the version, so
      # CI cannot drift onto a version the shipped image never had.
      - run: pip install -r proxy/requirements.in ruff==0.13.2
      - run: |
          python -m unittest discover -s tests -v
          for suite in modules/*/tests; do
            [ ! -d "$suite" ] || python -m unittest discover -s "$suite" -v
          done
      - run: python -m compileall -q proxy scripts search-adapter tests tools modules container
      - run: ruff check .
      - run: python scripts/check_locks.py
      # apt's shellcheck on the runner image is two major releases behind, and the linters differ
      # between them, so this gate would report a different set of defects depending on which image
      # the job landed on -- and change again when ubuntu-latest moves. Pin the published release
      # and verify its digest rather than depending on whichever version the image carries.
      - name: Install pinned shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          case "$(uname -m)" in
            x86_64)
              asset="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
              digest=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
              ;;
            aarch64)
              asset="shellcheck-${SHELLCHECK_VERSION}.linux.aarch64.tar.gz"
              digest=68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${asset}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${asset}"
          printf '%s  %s\n' "${digest}" "${RUNNER_TEMP}/${asset}" | sha256sum --check --quiet
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}"
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 \
            "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "${RUNNER_TEMP}/bin/shellcheck"
          # `$GITHUB_PATH` only reaches the steps that follow, so prepend it here too and let the
          # guard below resolve `shellcheck` through PATH rather than by absolute path: that is the
          # same lookup the lint step performs, and it outranks anything the runner image carries.
          export PATH="${RUNNER_TEMP}/bin:${PATH}"
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"
          shellcheck --version
          if [ "$(shellcheck --version | sed -n 's/^version: //p')" != "${SHELLCHECK_VERSION#v}" ]; then
            echo "shellcheck still resolves a version other than ${SHELLCHECK_VERSION}." >&2
            exit 1
          fi
      - run: git ls-files '*.sh' -z | xargs -0 -n1 bash -n
      - run: git ls-files '*.sh' -z | xargs -0 shellcheck
      - run: npm ci --ignore-scripts --prefix container

  compose:
    runs-on: ubuntu-latest
    env:
      # The floor tools/runtime.sh declares, and the release this repository is tested against.
      COMPOSE_VERSION: v5.5.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The runner image ships a Compose older than that floor. Below v5.0.2, `config --format
      # json` drops an explicit `create_host_path: false`, so the confinement gate cannot read the
      # option it enforces and would refuse a sound launch. Pin the published binary and verify
      # its digest rather than depending on whichever version the runner image happens to carry.
      - name: Install pinned Docker Compose
        run: |
          case "$(uname -m)" in
            x86_64)
              asset=docker-compose-linux-x86_64
              digest=db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576
              ;;
            aarch64)
              asset=docker-compose-linux-aarch64
              digest=732e3a84c1a0f67256ce80bc2598a24546b10ca05f9faa97efceb1171ece2ef7
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/docker-compose" \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/${asset}"
          printf '%s  %s\n' "${digest}" "${RUNNER_TEMP}/docker-compose" | sha256sum --check --quiet
          # A user plugin directory outranks the copy the runner image installed system-wide.
          mkdir -p "${HOME}/.docker/cli-plugins"
          install -m 0755 "${RUNNER_TEMP}/docker-compose" "${HOME}/.docker/cli-plugins/docker-compose"
          docker compose version
          if [ "$(docker compose version --short)" != "${COMPOSE_VERSION#v}" ]; then
            echo "docker still resolves a Compose other than ${COMPOSE_VERSION}." >&2
            exit 1
          fi
      - run: tests/compose-config.sh --runtime

  build-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker buildx build --platform '${{ matrix.platform }}' proxy
      - run: docker buildx build --platform '${{ matrix.platform }}' search-adapter

  build-agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            asset: kimi-code-linux-x64.tar.gz
          - platform: linux/arm64
            asset: kimi-code-linux-arm64.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: kimi
        env:
          KIMI_ASSET: '${{ matrix.asset }}'
        run: |
          PYTHONPATH=scripts python - <<'PY' >>"${GITHUB_OUTPUT}"
          import os
          from select_versions import fetch_asset_checksum, kimi_catalog
          catalog, latest = kimi_catalog(os.environ["KIMI_ASSET"])
          selected = next(item for item in catalog if item["version"] == latest)
          print(f"version={selected['version']}")
          print(f"url={selected['url']}")
          print(f"sha256={fetch_asset_checksum(selected)}")
          PY
      - run: |
          docker buildx build --platform '${{ matrix.platform }}' -f container/Dockerfile \
            --build-arg KIMI_CODE_VERSION='${{ steps.kimi.outputs.version }}' \
            --build-arg KIMI_CODE_ASSET_URL='${{ steps.kimi.outputs.url }}' \
            --build-arg KIMI_CODE_ASSET_SHA256='${{ steps.kimi.outputs.sha256 }}' .

  build-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: |
          for build in modules/*/tests/build.sh; do
            [ ! -f "$build" ] || bash "$build"
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      - run: python scripts/check_locks.py
      - run: docker build -t adrc-model-proxy:ci proxy
      - run: docker build -t adrc-search-adapter:ci search-adapter
      - run: scripts/generate_sbom.sh .artifacts/sbom adrc-model-proxy:ci adrc-search-adapter:ci
