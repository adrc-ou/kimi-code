name: CI

on:
  pull_request:
  push:
    branches: [main, restructure/current-kimi-code]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp==3.14.3 ruff==0.13.2
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q proxy scripts search-adapter tests tools
      - run: ruff check .
      - run: python scripts/check_locks.py
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: git ls-files '*.sh' -z | xargs -0 -n1 bash -n
      - run: git ls-files '*.sh' -z | xargs -0 shellcheck
      - run: npm ci --ignore-scripts --prefix container

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: tests/compose-config.sh

  build-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker buildx build --platform '${{ matrix.platform }}' proxy
      - run: docker buildx build --platform '${{ matrix.platform }}' search-adapter

  build-agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            asset: kimi-code-linux-x64.tar.gz
          - platform: linux/arm64
            asset: kimi-code-linux-arm64.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: kimi
        env:
          KIMI_ASSET: '${{ matrix.asset }}'
        run: |
          PYTHONPATH=scripts python - <<'PY' >>"${GITHUB_OUTPUT}"
          import os
          from select_versions import fetch_asset_checksum, kimi_catalog
          catalog, latest = kimi_catalog(os.environ["KIMI_ASSET"])
          selected = next(item for item in catalog if item["version"] == latest)
          print(f"version={selected['version']}")
          print(f"url={selected['url']}")
          print(f"sha256={fetch_asset_checksum(selected)}")
          PY
      - run: |
          docker buildx build --platform '${{ matrix.platform }}' -f container/Dockerfile \
            --build-arg KIMI_CODE_VERSION='${{ steps.kimi.outputs.version }}' \
            --build-arg KIMI_CODE_ASSET_URL='${{ steps.kimi.outputs.url }}' \
            --build-arg KIMI_CODE_ASSET_SHA256='${{ steps.kimi.outputs.sha256 }}' .

  build-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: |
          set -a
          source comfy/backend.env
          set +a
          docker buildx build --platform linux/amd64 -f comfy/Dockerfile.cuda \
            --build-arg COMFYUI_VERSION=v0.35.0 \
            --build-arg COMFYUI_COMMIT=40c4fcdf513a4523e39d54a9d391908af8df8171 \
            --build-arg TORCH_VERSION --build-arg TORCHVISION_VERSION \
            --build-arg TORCHAUDIO_VERSION --build-arg PYTORCH_CUDA_INDEX_URL .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      - run: python scripts/check_locks.py
      - run: docker build -t adrc-model-proxy:ci proxy
      - run: docker build -t adrc-search-adapter:ci search-adapter
      - run: scripts/generate_sbom.sh .artifacts/sbom adrc-model-proxy:ci adrc-search-adapter:ci
