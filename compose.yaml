services:
  agent-state-init:
    image: "adrc-kimi-agent:${HARNESS_IMAGE_SUFFIX:?Generated by start.sh}"
    user: "0:0"
    network_mode: none
    entrypoint: ["python3", "/initialize-agent-state.py"]
    command: ["${LOCAL_UID:-1000}", "${LOCAL_GID:-1000}"]
    volumes:
      - ./container/initialize-agent-state.py:/initialize-agent-state.py:ro
      - type: volume
        source: kimi-state
        target: /state/kimi
        volume:
          nocopy: true
      - type: volume
        source: serena-state
        target: /state/serena
        volume:
          nocopy: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    pids_limit: 64

  model-proxy:
    image: "adrc-model-proxy:${HARNESS_IMAGE_SUFFIX:?Generated by start.sh}"
    volumes:
      - "${KIMI_RENDERED_CONFIG:?Generated by start.sh}:/policy/kimi-config.toml:ro"
    build:
      context: ./proxy

    environment:
      KIMI_CONFIG_PATH: /policy/kimi-config.toml
      NRP_API_KEY_FILE: /run/secrets/nrp_api_key
      NRP_INTERNAL_TOKEN_FILE: /run/secrets/nrp_internal_token
      NRP_CACHE_SALT_FILE: /run/secrets/nrp_cache_salt
      NRP_UPSTREAM_ORIGIN: "${LITELLM_UPSTREAM_ORIGIN:?Set LITELLM_UPSTREAM_ORIGIN in .env}"
      NRP_UPSTREAM_MODEL: "${LITELLM_MODEL_ID:?Set LITELLM_MODEL_ID in .env}"
      NRP_MODEL_CONTEXT: "${NRP_MODEL_CONTEXT:-1000000}"
      NRP_FAIR_USE_PERCENT: "${NRP_FAIR_USE_PERCENT:-35}"
      NRP_PARALLEL_CONTEXT_BUDGET: "${NRP_PARALLEL_CONTEXT_BUDGET:-320000}"
      NRP_MODEL_MAX_CONCURRENCY: "${NRP_MODEL_MAX_CONCURRENCY:-16}"
      NRP_SUBAGENT_MAX_CONCURRENCY: "${KIMI_SUBAGENT_CONCURRENCY:-5}"
      NRP_MAX_REQUEST_BYTES: "${NRP_MAX_REQUEST_BYTES:-268435456}"
      NRP_MAX_RESPONSE_BYTES: "${NRP_MAX_RESPONSE_BYTES:-536870912}"
      NRP_MAX_ERROR_BYTES: "${NRP_MAX_ERROR_BYTES:-65536}"
      NRP_MAX_QUEUED: "${NRP_MAX_QUEUED:-32}"
      NRP_PRIMARY_MAX_OUTPUT_TOKENS: "${NRP_PRIMARY_MAX_OUTPUT_TOKENS:-65536}"
      NRP_LONG_MAX_OUTPUT_TOKENS: "${NRP_LONG_MAX_OUTPUT_TOKENS:-65536}"
      NRP_SUBAGENT_MAX_OUTPUT_TOKENS: "${NRP_SUBAGENT_MAX_OUTPUT_TOKENS:-8192}"

    secrets:
      - nrp_api_key
      - nrp_internal_token
      - nrp_cache_salt

    networks:
      agent-proxy: {}
      proxy-egress: {}

    read_only: true

    tmpfs:
      - /tmp:rw,nosuid,nodev

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    pids_limit: 512
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "3"}

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3

  kimi-agent:
    image: "adrc-kimi-agent:${HARNESS_IMAGE_SUFFIX:?Generated by start.sh}"
    build:
      context: .
      dockerfile: container/Dockerfile
      args:
        KIMI_CODE_VERSION: "${KIMI_CODE_VERSION:?}"
        KIMI_CODE_ASSET_URL: "${KIMI_CODE_ASSET_URL:?}"
        KIMI_CODE_ASSET_SHA256: "${KIMI_CODE_ASSET_SHA256:?}"
        AGENT_UID: "${LOCAL_UID:-1000}"
        AGENT_GID: "${LOCAL_GID:-1000}"

    depends_on:
      agent-state-init:
        condition: service_completed_successfully
      model-proxy:
        condition: service_healthy

    networks:
      agent-proxy: {}
      agent-egress: {}

    working_dir: /workspace
    init: true

    environment:
      KIMI_CODE_HOME: /home/agent/.kimi-code
      XDG_CONFIG_HOME: /home/agent/.cache/config
      KIMI_DISABLE_TELEMETRY: "1"
      KIMI_CODE_NO_AUTO_UPDATE: "1"
      KIMI_TOKEN_COUNTING_STRATEGY: "measured+estimated"
      KIMI_CODE_AGENT_SWARM_MAX_CONCURRENCY: "${KIMI_SUBAGENT_CONCURRENCY:-5}"
      KIMI_CODE_BACKGROUND_MAX_RUNNING_TASKS: "${KIMI_SUBAGENT_CONCURRENCY:-5}"
      KIMI_SUBAGENT_TIMEOUT_MS: "3600000"
      KIMI_CODE_SWARM_TIMEOUT_MS: "3600000"

      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN:-}"
      CONTEXT7_API_KEY: "${CONTEXT7_API_KEY:-}"

    volumes:
      - type: bind
        source: "${WORKSPACE_PATH:?Set WORKSPACE_PATH in .env}"
        target: /workspace
        read_only: false
        bind:
          create_host_path: false
      - kimi-state:/home/agent/.kimi-code
      - serena-state:/home/agent/.serena
      - "${KIMI_RENDERED_CONFIG:?Generated by start.sh}:/home/agent/.kimi-code/config.toml:ro"
      - "${HARNESS_RUNTIME_DIR:?}/assets/mcp.json:/home/agent/.kimi-code/mcp.json:ro"
      - ./runtime/AGENTS.md:/home/agent/.kimi-code/AGENTS.md:ro
      - "${KIMI_EMPTY_SYSTEM:?Generated by start.sh}:/home/agent/.kimi-code/SYSTEM.md:ro"
      - "${KIMI_EMPTY_USER_AGENTS:?Generated by start.sh}:/home/agent/.kimi-code/agents:ro"
      - "${KIMI_EMPTY_USER_SKILLS:?Generated by start.sh}:/home/agent/.kimi-code/skills:ro"
      - "${KIMI_EMPTY_USER_PLUGINS:?Generated by start.sh}:/home/agent/.kimi-code/plugins:ro"
      - "${HARNESS_RUNTIME_DIR:?}/assets/skills:/opt/kimi-runtime/skills:ro"
      - "${HARNESS_RUNTIME_DIR:?}/assets/agents:/opt/kimi-runtime/agents:ro"
      - "${HARNESS_RUNTIME_DIR:?}/assets/tools:/opt/kimi-runtime/tools:ro"

    read_only: true

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g
      - /home/agent/.cache:rw,nosuid,nodev,size=1g,uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=0700

    ports:
      - "127.0.0.1:5494:5494"

    security_opt:
      - no-new-privileges:true
      - seccomp=./container/chromium-seccomp.json

    cap_drop:
      - ALL

    pids_limit: 2048
    shm_size: "1gb"
    logging:
      driver: json-file
      options: {max-size: 50m, max-file: "3"}

    command:
      - kimi
      - web
      - --host
      - 0.0.0.0
      - --port
      - "5494"
      - --no-open

volumes:
  kimi-state:
  serena-state:

secrets:
  nrp_api_key:
    file: "${NRP_API_KEY_FILE:?Generated by start.sh}"
  nrp_internal_token:
    file: "${NRP_INTERNAL_TOKEN_FILE:?Generated by start.sh}"
  nrp_cache_salt:
    file: "${NRP_CACHE_SALT_FILE:?Generated by start.sh}"

networks:
  agent-proxy:
    internal: true
  agent-egress: {}
  proxy-egress: {}
