services:
  agent-state-init:
    image: "adrc-kimi-agent:${HARNESS_IMAGE_SUFFIX:?Generated by start.sh}"
    user: "0:0"
    network_mode: none
    entrypoint: ["python3", "/initialize-agent-state.py"]
    command: ["--uid", "${LOCAL_UID:-1000}", "--gid", "${LOCAL_GID:-1000}"]
    volumes:
      - ./container/initialize-agent-state.py:/initialize-agent-state.py:ro
      - ./tools/kimi_config_merge.py:/stage/kimi_config_merge.py:ro
      - "${KIMI_RENDERED_AGENTS_MD:?Generated by start.sh}:/stage/AGENTS.md:ro"
      - ./runtime/config-policy.json:/stage/config-policy.json:ro
      - ./runtime/serena-config.yml:/stage/serena-config.yml:ro
      - "${KIMI_RENDERED_CONFIG:?Generated by start.sh}:/stage/kimi-config.toml:ro"
      - "${KIMI_SYSTEM_MD:?Generated by start.sh}:/stage/SYSTEM.md:ro"
      - "${HARNESS_RUNTIME_DIR:?}/assets:/stage/assets:ro"
      - type: volume
        source: kimi-state
        target: /state/kimi
        volume:
          nocopy: true
      - type: volume
        source: serena-state
        target: /state/serena
        volume:
          nocopy: true
      - type: volume
        source: kimi-assets
        target: /state/assets
        volume:
          nocopy: true
      - type: volume
        source: kimi_user_agents
        target: /state/managed/agents
        volume:
          nocopy: true
      - type: volume
        source: kimi_user_skills
        target: /state/managed/skills
        volume:
          nocopy: true
      - type: volume
        source: kimi_user_plugins
        target: /state/managed/plugins
        volume:
          nocopy: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, LINUX_IMMUTABLE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64

  model-proxy:
    image: "adrc-model-proxy:${HARNESS_IMAGE_SUFFIX:?Generated by start.sh}"
    volumes:
      # Enforcement input: the plan derived from ./models + ./providers at launch.
      - "${MODEL_PROXY_POLICY_FILE:?Generated by start.sh}:/policy/model-policy.json:ro"
      # Cross-check input: the Kimi configuration this plan was rendered into, so a
      # configuration the proxy cannot honour fails closed instead of sending traffic.
      - "${KIMI_RENDERED_CONFIG:?Generated by start.sh}:/policy/kimi-config.toml:ro"
      # Prompt archive output: one file per new user prompt, named on the proxy's stdout by
      # its path on this host, and emptied when the container stops. This is the only writable
      # host path the proxy has, it holds conversation text rather than credentials, and it is
      # mounted into no other container.
      - "${HARNESS_RUNTIME_DIR:?Generated by start.sh}/prompt-log:/prompt-log"
    build:
      context: ./proxy

    environment:
      MODEL_PROXY_POLICY: /policy/model-policy.json
      KIMI_CONFIG_PATH: /policy/kimi-config.toml
      MODEL_PROXY_INTERNAL_TOKEN_FILE: /run/secrets/proxy_internal_token
      MODEL_PROXY_CACHE_SALT_FILE: /run/secrets/proxy_cache_salt

      # Bounded ingress and stall detection. These protect the container and its
      # fair-use permits; no model window or provider percentage appears here.
      MODEL_PROXY_MAX_REQUEST_BYTES: "${MODEL_PROXY_MAX_REQUEST_BYTES:-268435456}"
      MODEL_PROXY_MAX_RESPONSE_BYTES: "${MODEL_PROXY_MAX_RESPONSE_BYTES:-536870912}"
      MODEL_PROXY_MAX_ERROR_BYTES: "${MODEL_PROXY_MAX_ERROR_BYTES:-65536}"
      MODEL_PROXY_MAX_QUEUED: "${MODEL_PROXY_MAX_QUEUED:-32}"
      MODEL_PROXY_SOCK_READ_TIMEOUT: "${MODEL_PROXY_SOCK_READ_TIMEOUT:-300}"
      MODEL_PROXY_MAX_REQUEST_SECONDS: "${MODEL_PROXY_MAX_REQUEST_SECONDS:-3600}"
      MODEL_PROXY_INPUT_GUARD_PERCENT: "${MODEL_PROXY_INPUT_GUARD_PERCENT:-150}"
      MODEL_PROXY_MEDIA_TOKEN_ESTIMATE: "${MODEL_PROXY_MEDIA_TOKEN_ESTIMATE:-1600}"
      MODEL_PROXY_REQUEST_USAGE: "${MODEL_PROXY_REQUEST_USAGE:-1}"

      # The prompt archive, and the path the same directory has on the host, which is the one
      # worth naming on stdout. Both are the proxy's own; the agent cannot read either.
      MODEL_PROXY_PROMPT_LOG_DIR: /prompt-log
      MODEL_PROXY_PROMPT_LOG_HOST_DIR: "${HARNESS_RUNTIME_DIR:?Generated by start.sh}/prompt-log"

    secrets:
      - proxy_internal_token
      - proxy_cache_salt

    networks:
      agent-proxy: {}
      proxy-egress: {}

    read_only: true

    # The proxy's only file output is its prompt archive, which goes to its own bind mount and
    # not to this tmpfs. An unsized tmpfs is capped at half of host RAM and this container
    # accepts 256 MiB multimodal bodies, so the size bounds what agent-originated traffic can
    # consume; noexec closes file-backed execution in a container that parses remote payloads.
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=1g

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    pids_limit: 512
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "3"}

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3

  kimi-agent:
    image: "adrc-kimi-agent:${HARNESS_IMAGE_SUFFIX:?Generated by start.sh}"
    build:
      context: .
      dockerfile: container/Dockerfile
      args:
        KIMI_CODE_VERSION: "${KIMI_CODE_VERSION:?}"
        KIMI_CODE_ASSET_URL: "${KIMI_CODE_ASSET_URL:?}"
        KIMI_CODE_ASSET_SHA256: "${KIMI_CODE_ASSET_SHA256:?}"
        AGENT_UID: "${LOCAL_UID:-1000}"
        AGENT_GID: "${LOCAL_GID:-1000}"

    depends_on:
      agent-state-init:
        condition: service_completed_successfully
      model-proxy:
        condition: service_healthy

    networks:
      agent-proxy: {}
      agent-egress: {}

    working_dir: /workspace
    init: true

    environment:
      KIMI_CODE_HOME: /home/agent/.kimi-code
      XDG_CONFIG_HOME: /home/agent/.cache/config
      KIMI_DISABLE_TELEMETRY: "1"
      KIMI_CODE_NO_AUTO_UPDATE: "1"
      KIMI_TOKEN_COUNTING_STRATEGY: "measured+estimated"

      # The permission-mode banner. Written to runtime.env by the renderer, always in both states:
      # an unset value would fall through to the default below and a panel choice to turn the
      # banner off would silently do nothing.
      KIMI_CODE_PERMISSION_MODE_REMINDER: "${KIMI_CODE_PERMISSION_MODE_REMINDER:-true}"

      # Fair-use concurrency, derived from the selected models at launch: the proxy grants at
      # most this many simultaneous subagent requests. Task slots sit above it so backgrounded
      # Bash commands cannot consume a subagent lane; the extras queue at the proxy.
      KIMI_CODE_AGENT_SWARM_MAX_CONCURRENCY: "${KIMI_SUBAGENT_CONCURRENCY:?Generated by start.sh}"
      KIMI_CODE_BACKGROUND_MAX_RUNNING_TASKS: "${KIMI_BACKGROUND_TASK_SLOTS:?Generated by start.sh}"
      KIMI_CODE_BACKGROUND_BASH_TASK_TIMEOUT_S: "${KIMI_BACKGROUND_BASH_TASK_TIMEOUT_S:-0}"

      # Managed providers go down for maintenance and come back; retry rather than failing a
      # multi-hour subagent run. Aborting a session still cancels immediately.
      KIMI_CODE_INFINITE_RETRY: "1"

      # Subagent and swarm wall-clock caps are intentionally NOT set here. Environment
      # variables outrank config.toml and accept only a positive integer, so the
      # unlimited setting lives in runtime/config.toml as [subagent]/[swarm]
      # timeout_ms = 0, where the launcher re-pins it as policy.

      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN:-}"
      CONTEXT7_API_KEY: "${CONTEXT7_API_KEY:-}"

    volumes:
      # Core mounts only: the workspace bind is the single host path this container can observe.
      # Module and approved-extension overlays add their own binds and must justify each one.
      - type: bind
        source: "${WORKSPACE_PATH:?Set WORKSPACE_PATH in .env}"
        target: /workspace
        read_only: false
        bind:
          create_host_path: false
      - type: volume
        source: kimi-state
        target: /home/agent/.kimi-code
        volume:
          nocopy: true
      - type: volume
        source: serena-state
        target: /home/agent/.serena
        volume:
          nocopy: true
      - type: volume
        source: kimi-assets
        target: /opt/kimi-runtime
        volume:
          nocopy: true
      - type: volume
        source: kimi_user_agents
        target: /home/agent/.kimi-code/agents
        volume:
          nocopy: true
      - type: volume
        source: kimi_user_skills
        target: /home/agent/.kimi-code/skills
        volume:
          nocopy: true
      - type: volume
        source: kimi_user_plugins
        target: /home/agent/.kimi-code/plugins
        volume:
          nocopy: true

    read_only: true

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g
      - /home/agent/.cache:rw,nosuid,nodev,size=1g,uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=0700

    ports:
      - "127.0.0.1:5494:5494"

    security_opt:
      - no-new-privileges:true
      - seccomp=./container/chromium-seccomp.json

    cap_drop:
      - ALL

    pids_limit: 2048
    shm_size: "1gb"
    logging:
      driver: json-file
      options: {max-size: 50m, max-file: "3"}

    command:
      - kimi
      - web
      - --host
      - 0.0.0.0
      - --port
      - "5494"
      - --no-open

volumes:
  kimi-state:
  serena-state:
  kimi-assets:
  kimi_user_agents:
  kimi_user_skills:
  kimi_user_plugins:

secrets:
  proxy_internal_token:
    file: "${MODEL_PROXY_INTERNAL_TOKEN_FILE:?Generated by start.sh}"
  proxy_cache_salt:
    file: "${MODEL_PROXY_CACHE_SALT_FILE:?Generated by start.sh}"

networks:
  agent-proxy:
    internal: true
  agent-egress: {}
  proxy-egress: {}
