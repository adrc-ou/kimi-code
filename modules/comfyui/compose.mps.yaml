services:
  # The bridge certificate is generated per launch under the instance runtime directory.
  # Binding that file into the agent would name the instance directory in its mount table,
  # so a root-only one-shot copies it into a named volume and the agent sees only a volume.
  comfy-bridge-ca-init:
    image: "adrc-kimi-agent:${HARNESS_IMAGE_SUFFIX:?Generated by start.sh}"
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command: ["cp /in/bridge.crt /staged/ca.crt && chmod 0444 /staged/ca.crt"]
    volumes:
      - type: bind
        source: "${COMFYUI_BRIDGE_CERT:?Generated by start.sh}"
        target: /in/bridge.crt
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: comfy-bridge-ca
        target: /staged
        volume:
          nocopy: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32

  # ComfyUI's frontend cannot present the bridge's bearer token: a browser attaches no header to
  # a navigation or to the subresources its page asks for. This container gives the agent an origin
  # it can simply open, and forwards every byte of it to the bridge over verified TLS, so the bridge
  # still authenticates every path and the credential that arrives is the browser's own session
  # rather than a token embedded in a URL. It publishes no port and binds no host path; the agent
  # can reach this listener as a client and nothing else about this container is reachable at all.
  comfyui-ui:
    build:
      context: .
      dockerfile: modules/comfyui/frontend/Dockerfile
    image: "adrc-comfyui-ui:${HARNESS_IMAGE_SUFFIX:?Generated by start.sh}"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command:
      - --listen
      - 0.0.0.0
      - --port
      - "8188"
      - --upstream-host
      - host.docker.internal
      - --upstream-port
      - "8190"
      - --tls-ca
      - /run/comfy-bridge/ca.crt
    # The listener is plaintext, so it is reachable only from these two networks: one private to
    # the agent, and one that exists solely so this container may reach the host's bridge.
    networks:
      comfy-ui: {}
      comfy-egress: {}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      comfy-bridge-ca-init:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: comfy-bridge-ca
        target: /run/comfy-bridge
        read_only: true
        volume:
          nocopy: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/__bridge/open', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  kimi-agent:
    depends_on:
      comfy-bridge-ca-init:
        condition: service_completed_successfully
      comfyui-ui:
        condition: service_healthy
    networks:
      comfy-ui: {}
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      COMFYUI_CONNECT_TIMEOUT: "${COMFYUI_CONNECT_TIMEOUT:-10}"
      COMFYUI_READ_TIMEOUT: "${COMFYUI_READ_TIMEOUT:-60}"
      COMFYUI_TOTAL_TIMEOUT: "${COMFYUI_TOTAL_TIMEOUT:-1800}"
      COMFYUI_MAX_JSON_BYTES: "${COMFYUI_MAX_JSON_BYTES:-16777216}"
      COMFYUI_MAX_TRANSFER_BYTES: "${COMFYUI_MAX_TRANSFER_BYTES:-17179869184}"
      COMFYUI_URL: "https://host.docker.internal:8190"
      COMFYUI_UI_URL: "http://comfyui-ui:8188"
      COMFYUI_TOKEN: "${COMFYUI_TOKEN:?Generated by start.sh}"
      COMFYUI_CA_FILE: /run/comfy-bridge/ca.crt
    volumes:
      - type: volume
        source: comfy-bridge-ca
        target: /run/comfy-bridge
        read_only: true
        volume:
          nocopy: true

volumes:
  comfy-bridge-ca:

networks:
  # Internal, because the only thing on it is the agent and the origin it browses.
  comfy-ui:
    internal: true
  # Not internal, because reaching the host's bridge is the whole point of this container.
  comfy-egress: {}
