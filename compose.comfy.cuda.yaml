services:
  comfyui:
    image: "adrc-comfyui-cuda:${HARNESS_IMAGE_SUFFIX:?Generated by start.sh}"
    build:
      context: .
      dockerfile: comfy/Dockerfile.cuda
      args:
        COMFYUI_VERSION: "${COMFYUI_VERSION:?}"
        COMFYUI_COMMIT: "${COMFYUI_COMMIT:?}"
        APP_UID: "${LOCAL_UID:-1000}"
        APP_GID: "${LOCAL_GID:-1000}"
        TORCH_VERSION: "${TORCH_VERSION:?}"
        TORCHVISION_VERSION: "${TORCHVISION_VERSION:?}"
        TORCHAUDIO_VERSION: "${TORCHAUDIO_VERSION:?}"
        PYTORCH_CUDA_INDEX_URL: "${PYTORCH_CUDA_INDEX_URL:?}"
    gpus: all
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=8g
    volumes:
      - type: bind
        source: "${COMFYUI_MODELS_PATH:?Verified by start.sh}"
        target: /opt/ComfyUI/models
        bind:
          create_host_path: false
      - type: bind
        source: "${COMFYUI_CUSTOM_NODES_PATH:?Verified by start.sh}"
        target: /opt/ComfyUI/custom_nodes
        bind:
          create_host_path: false
      - type: bind
        source: "${COMFYUI_INPUT_PATH:?Verified by start.sh}"
        target: /data/input
        bind:
          create_host_path: false
      - type: bind
        source: "${COMFYUI_OUTPUT_PATH:?Verified by start.sh}"
        target: /data/output
        bind:
          create_host_path: false
      - type: bind
        source: "${COMFYUI_TEMP_PATH:?Verified by start.sh}"
        target: /data/temp
        bind:
          create_host_path: false
      - type: bind
        source: "${COMFYUI_USER_PATH:?Verified by start.sh}"
        target: /data/user
        bind:
          create_host_path: false
      - comfy-cache:/data/cache
    ports:
      - "127.0.0.1:8188:8188"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 4096
    shm_size: "8gb"
    logging:
      driver: json-file
      options: {max-size: 100m, max-file: "3"}
    networks:
      agent-comfy: {}
      comfy-egress: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  kimi-agent:
    depends_on:
      comfyui:
        condition: service_healthy
    environment:
      COMFYUI_URL: "http://comfyui:8188"
      COMFYUI_TOKEN: ""
    networks:
      agent-comfy: {}

volumes:
  comfy-cache:

networks:
  agent-comfy:
    internal: true
  comfy-egress: {}
